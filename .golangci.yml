version: "2"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - unconvert
    - dupl
    # exportloopref removed — deprecated since Go 1.22, now handled by built-in loopvar check

issues:
  max-issues-per-linter: 50
  max-same-issues: 3
  new: false
  fix: false
  uniq-by-line: true
  whole-files: false

run:
  timeout: 5m
  tests: true


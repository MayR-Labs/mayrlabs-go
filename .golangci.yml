version: 2

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  govet:
    enable-all: true
  gocyclo:
    min-complexity: 15
  dupl:
    threshold: 100
  goconst:
    min-len: 3
    min-occurrences: 3
  misspell:
    locale: US
  lll:
    line-length: 120
  goimports:
    local-prefixes: github.com/MayR-Labs/mayrlabs-go
  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - unconvert
    - dupl
    # exportloopref removed — deprecated since Go 1.22, now handled by built-in loopvar check

issues:
  exclude-dirs:
    - vendor
    - tmp
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - dupl
        - goconst

run:
  timeout: 5m
  tests: true

output:
  format: colored-line-number
